      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root">
      <!-- Loading indicator shown before React mounts - prevents black screen -->
      <div id="initial-loader" style="
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
        color: #fff;
        font-family: 'Playfair Display', serif;
      ">
        <img 
          src="/img/favicon11.png" 
          alt="The Golden Olive" 
          style="width: 80px; height: 80px; margin-bottom: 24px; animation: pulse 1.5s ease-in-out infinite;"
          onerror="this.style.display='none'"
        />
        <div style="
          display: flex;
          gap: 8px;
        ">
          <span style="
            width: 12px;
            height: 12px;
            background: #ffc107;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
          "></span>
          <span style="
            width: 12px;
            height: 12px;
            background: #ffc107;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out 0.2s infinite;
          "></span>
          <span style="
            width: 12px;
            height: 12px;
            background: #ffc107;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out 0.4s infinite;
          "></span>
        </div>
        <style>
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
          }
          @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Fallback script to handle loading timeout -->
    <script>
      // If React doesn't mount within 10 seconds, show error and offer refresh
      setTimeout(function() {
        var loader = document.getElementById('initial-loader');
        if (loader && loader.parentElement && loader.parentElement.children.length === 1) {
          loader.innerHTML = '<div style="text-align: center; padding: 2rem;">' +
            '<h2 style="color: #ffc107; margin-bottom: 1rem;">Laden duurt langer dan verwacht</h2>' +
            '<p style="margin-bottom: 1.5rem;">Probeer de pagina te vernieuwen.</p>' +
            '<button onclick="clearCachesAndReload()" style="' +
              'padding: 0.75rem 2rem;' +
              'background: #ffc107;' +
              'color: #000;' +
              'border: none;' +
              'border-radius: 8px;' +
              'cursor: pointer;' +
              'font-weight: 600;' +
              'font-size: 1rem;' +
            '">Vernieuwen</button>' +
          '</div>';
        }
      }, 10000);
      
      // Function to clear caches and reload
      function clearCachesAndReload() {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              caches.delete(name);
            });
          }).then(function() {
            // Also unregister service worker
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(registration) {
                  registration.unregister();
                });
              });
            }
            // Force reload from server
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      }
    </script>
  </body>
